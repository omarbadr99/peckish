<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Peckish Prototype</title>
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
</style>
<style>
/* Peckish prototype. One phone-sized stage: white ground, beige surfaces, near-black ink, one muted green accent.
   Colour lives in the food: every meal sits on a soft orb tinted by its protein. Key numbers are drawn in dot-matrix. */
:root {
  --surface-bg: #ffffff; --surface-card: #f3efe8; --surface-inset: #ffffff; --line-hair: #e6e1d8;
  --ink-primary: #111110; --ink-secondary: #65615a; --ink-tertiary: #a19c93; --ink-inverse: #ffffff;
  --accent: #86c59a; --accent-ink: #10301c;
  --person-omar: #4f7dff; --person-ruba: #ef5d95; --person-rhea: #ff9b61;
  --glow-base: #ffc7a6; --glow-1: #ffe38f; --glow-2: #ff8fc0; --glow-3: #b9a5ff; --glow-4: #a8e6b8;
  --chrome-base: #3a3d42; --chrome-1: #c9ced6; --chrome-2: #15171a; --chrome-3: #5a6068; --chrome-4: #8c9299;
  --scrim: rgba(17, 17, 16, 0.34);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-48: 48px;
  --radius-cell: 12px; --radius-tile: 20px; --radius-card: 28px; --radius-sheet: 32px; --radius-screen: 44px; --radius-pill: 999px;
  --shadow-float: 0 10px 30px rgba(17, 17, 16, 0.1);
  --control-sm: 36px; --control-md: 40px; --control-lg: 56px;
  --duration-tap: 120ms; --duration-fast: 200ms; --duration-base: 320ms; --duration-slow: 560ms; --duration-bloom: 900ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.4, 0, 1, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --gl: max(var(--space-20), env(safe-area-inset-left, 0px)); --gr: max(var(--space-20), env(safe-area-inset-right, 0px));
  --fit: 1; color-scheme: light;
}
[data-theme="beige"] { --surface-bg: #f3efe8; --surface-card: #ffffff; --surface-inset: #f3efe8; --line-hair: #e0dacf; }
[data-theme="night"] { --surface-bg: #000000; --surface-card: #171717; --surface-inset: #242424; --line-hair: #2b2b2b; --ink-primary: #ffffff; --ink-secondary: #aaa69e; --ink-tertiary: #8f8a82; --ink-inverse: #111110; color-scheme: dark; }
/* Protein colours for the food orbs and swipe cards */
.h-chicken { --o1: #ffe7c4; --o2: #ffb96f; } .h-beef { --o1: #ffd8cd; --o2: #ff9080; } .h-fish { --o1: #d8eaff; --o2: #86b7ff; } .h-shrimp { --o1: #ffdbe5; --o2: #ffa2ba; }
.h-eggs { --o1: #fff4c7; --o2: #ffd564; } .h-dairy { --o1: #eee6ff; --o2: #c1adff; } .h-plant { --o1: #e2f7c9; --o2: #a2db92; } .h-rhea { --o1: #ffe7d8; --o2: #ffb98f; }
.h-none { --o1: var(--surface-inset); --o2: var(--surface-card); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { overscroll-behavior: none; }
body { margin: 0; background: var(--surface-bg); color: var(--ink-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
p, h1, h2, ol { margin: 0; }
h1, h2 { text-wrap: balance; }
button { appearance: none; -webkit-appearance: none; margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
input { font: inherit; color: inherit; }
i { font-style: normal; }
:focus-visible { outline: 2px solid var(--ink-primary); outline-offset: 3px; }

#stage { position: relative; height: 100%; overflow: hidden; }
#phone { --st: 8px; --sb: 0px; position: relative; width: 100%; height: 100%; background: var(--surface-bg); color: var(--ink-primary); overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
@media (min-width: 520px) and (min-height: 560px) {
  body { background: var(--surface-card); }
  #phone { --st: 14px; --sb: 8px; position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; margin: -422px 0 0 -195px; border: 1px solid var(--line-hair); border-radius: var(--radius-screen); transform: scale(var(--fit)); }
}

/* Type: system font, heavy headlines, mono labels */
.v2-display { font: 700 34px/1.04 var(--font-sans); letter-spacing: -0.035em; }
.v2-title { font: 600 22px/1.2 var(--font-sans); letter-spacing: -0.025em; }
.v2-headline { font: 600 17px/1.3 var(--font-sans); letter-spacing: -0.01em; }
.v2-body { font: 400 15px/1.45 var(--font-sans); }
.v2-button { font: 600 16px/1.2 var(--font-sans); }
.v2-label { font: 600 13px/1.3 var(--font-sans); }
.v2-caption { font: 400 12px/1.35 var(--font-sans); }
.v2-micro { font: 500 11px/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.v2-number { font: 400 13px/1.3 var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.ink2 { color: var(--ink-secondary); } .ink3 { color: var(--ink-tertiary); }
.dots { flex: none; display: block; }
.readout { display: flex; align-items: flex-end; gap: var(--space-8); min-height: 30px; }

/* Layout helpers */
.col { display: flex; flex-direction: column; } .col > * { flex-shrink: 0; }
.row { display: flex; align-items: center; }
.wrap { flex-wrap: wrap; } .grow { flex: 1 1 0; min-width: 0; }
.g4 { gap: var(--space-4); } .g8 { gap: var(--space-8); } .g12 { gap: var(--space-12); } .g16 { gap: var(--space-16); } .g20 { gap: var(--space-20); } .g24 { gap: var(--space-24); } .g32 { gap: var(--space-32); }
.mt8 { margin-top: var(--space-8); } .mt16 { margin-top: var(--space-16); }
.pad { padding-left: var(--gl); padding-right: var(--gr); }
.scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ic { flex: none; display: block; }
.food { flex: none; display: inline-block; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.dot { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-pill); }
.mint { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--accent); }
.why { display: flex; align-items: center; gap: var(--space-8); }
.sec { padding-top: var(--space-8); padding-bottom: var(--space-4); }
.linkish { display: inline-flex; align-items: center; gap: var(--space-4); height: var(--control-md); }
.hscroll { display: flex; gap: var(--space-12); overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding-top: var(--space-4); padding-bottom: var(--space-4); } .hscroll::-webkit-scrollbar { display: none; }
.pad > .hscroll { margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr)); padding-left: var(--gl); padding-right: var(--gr); }
.boot { padding-top: var(--space-48); }

/* Screens */
.tabview, .screen { position: absolute; inset: 0; }
.screen { display: flex; flex-direction: column; }
.screen > .scroll { flex: 1; min-height: 0; animation: rise var(--duration-base) var(--ease-out); }
.body-tabs { padding-bottom: calc(112px + var(--sb)); }
.dockbg { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: calc(46px + var(--sb)); background: var(--surface-bg); }
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); min-height: calc(var(--control-md) + var(--space-12) + var(--st)); padding-top: calc(var(--space-12) + var(--st)); }
.topbar .ticks { flex: 1; }
.full { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--surface-bg); color: var(--ink-primary); animation: fade-in var(--duration-base) var(--ease-out); }
.full.grid-bg { background-image: radial-gradient(circle, var(--line-hair) 1px, transparent 1.4px); background-size: 14px 14px; background-position: 7px 7px; }
.full.out, .ov.out { animation: fade-out var(--duration-fast) var(--ease-in) forwards; pointer-events: none; }
.foot { flex: none; padding-top: var(--space-12); padding-bottom: calc(var(--space-16) + var(--sb)); }
.flow-body, .onb-body { flex: 1; min-height: 0; }
.flow-body { padding-top: var(--space-12); } .onb-body { padding-top: var(--space-24); }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } }
@keyframes floaty { from { transform: translateY(-5px); } to { transform: translateY(5px); } }
@keyframes bloom { from { transform: scale(0.08); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
.pk-enter { animation: rise var(--duration-base) var(--ease-out); }
.pk-pop { animation: pop var(--duration-base) var(--ease-spring); }

/* Food orb and the big blended glow used for finished moments */
.orb { position: relative; flex: none; display: inline-block; isolation: isolate; }
.orb-face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(120% 120% at 28% 20%, var(--o1) 0%, var(--o2) 84%); color: var(--ink-secondary); }
.orb-glow { position: absolute; inset: 18% 10% -8%; z-index: -1; border-radius: 50%; background: var(--o2); filter: blur(20px); opacity: 0.6; }
.orb.is-done .food { opacity: 0.45; }
.orb-empty { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px dashed var(--ink-tertiary); color: var(--ink-tertiary); }
.cluster { position: relative; flex: none; height: 222px; }
.cl-it { position: absolute; animation: floaty 6s ease-in-out infinite alternate; }
.pk-aura {
  --a0: var(--glow-base); --a1: var(--glow-1); --a2: var(--glow-2); --a3: var(--glow-3); --a4: var(--glow-4);
  flex: none; display: block; border-radius: var(--radius-pill); background-color: var(--a0);
  background-image: radial-gradient(62% 62% at 30% 20%, var(--a1) 0%, transparent 100%), radial-gradient(62% 62% at 85% 80%, var(--a3) 0%, transparent 100%), radial-gradient(60% 60% at 10% 90%, var(--a2) 0%, transparent 100%), radial-gradient(55% 55% at 90% 15%, var(--a4) 0%, transparent 100%);
  background-repeat: no-repeat;
}
.pk-aura--chrome { --a0: var(--chrome-base); --a1: var(--chrome-4); --a2: var(--chrome-2); --a3: var(--chrome-3); --a4: var(--chrome-1); }
.pk-aura--tile { border-radius: var(--radius-card); }

/* Buttons */
.pk-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8); flex: none; height: var(--control-lg); padding: 0 var(--space-24); border-radius: var(--radius-pill); background: var(--ink-primary); color: var(--ink-inverse); white-space: nowrap; text-align: center; transition: transform var(--duration-tap) var(--ease-standard), opacity var(--duration-fast) var(--ease-standard); }
.pk-btn.grow { flex: 1 1 0; padding: 0 var(--space-12); }
.pk-btn:active { transform: scale(0.97); }
.pk-btn:disabled { opacity: 0.32; cursor: default; }
.pk-btn--secondary { background: var(--surface-card); color: var(--ink-primary); }
.pk-btn--secondary.is-on { background: var(--ink-primary); color: var(--ink-inverse); }
.pk-btn--glass { background: color-mix(in srgb, var(--surface-inset) 70%, transparent); color: var(--ink-primary); border: 1px solid var(--line-hair); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.pk-btn--md { height: var(--control-md); padding: 0 var(--space-20); }
.pk-btn--sm { height: var(--control-sm); padding: 0 var(--space-16); }
.pk-btn--block { display: flex; width: 100%; }
.pk-iconbtn { flex: none; display: inline-grid; place-items: center; width: var(--control-md); height: var(--control-md); border-radius: var(--radius-pill); background: var(--surface-card); color: var(--ink-primary); transition: transform var(--duration-tap) var(--ease-standard); }
.pk-iconbtn:active { transform: scale(0.94); }
.pk-iconbtn:disabled { opacity: 0.32; cursor: default; }
.pk-iconbtn.ghost { visibility: hidden; }
.pk-iconbtn.big, .pk-iconbtn.x2 { width: var(--control-lg); height: var(--control-lg); text-align: center; }
.headicon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--ink-primary); color: var(--ink-inverse); }

/* Tab bar: the one floating element */
.tabbar { position: absolute; z-index: 5; left: var(--gl); right: var(--gr); bottom: calc(var(--space-12) + var(--sb)); height: 64px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 6px; border: 1px solid var(--line-hair); border-radius: var(--radius-pill); background: var(--surface-bg); box-shadow: var(--shadow-float); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); height: 52px; border-radius: var(--radius-pill); color: var(--ink-secondary); transition: opacity var(--duration-fast) var(--ease-standard); }
.tab[aria-current] { color: var(--ink-inverse); }
.tab-ind { position: absolute; left: 6px; top: 5px; width: calc((100% - 12px) / 4); height: 52px; border-radius: var(--radius-pill); background: var(--ink-primary); transform: translateX(calc(var(--i) * 100%)); transition: transform var(--duration-base) var(--ease-spring); }

/* Small controls */
.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); height: 44px; padding: 4px; border-radius: var(--radius-pill); background: var(--surface-card); }
.seg-thumb { position: absolute; left: 4px; top: 4px; bottom: 4px; width: calc((100% - 8px) / var(--n)); border-radius: var(--radius-pill); background: var(--surface-inset); transform: translateX(calc(var(--i) * 100%)); transition: transform var(--duration-base) var(--ease-spring); }
.seg-opt { position: relative; text-align: center; color: var(--ink-secondary); border-radius: var(--radius-pill); } .seg-opt[aria-selected="true"] { color: var(--ink-primary); }
.sw { position: relative; flex: none; width: 50px; height: 30px; border-radius: var(--radius-pill); background: var(--line-hair); }
.sw-fill { position: absolute; inset: 0; border-radius: inherit; background: var(--accent); opacity: 0; transition: opacity var(--duration-fast) var(--ease-standard); } .sw.on .sw-fill { opacity: 1; }
.sw-knob { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: var(--radius-pill); background: var(--surface-inset); transition: transform var(--duration-base) var(--ease-spring); } .sw.on .sw-knob { transform: translateX(20px); }
.rowline, .optrow { display: flex; align-items: center; gap: var(--space-12); width: 100%; min-height: var(--control-lg); padding: var(--space-12) 0; border-bottom: 1px solid var(--line-hair); }
.rowline.col { align-items: flex-start; } .rowline.stretch { align-items: stretch; }
.optrow .food { width: 28px; text-align: center; }
.ticks { display: flex; gap: var(--space-4); } .ticks i { flex: 1; height: 3px; border-radius: var(--radius-pill); background: var(--line-hair); } .ticks i.on { background: var(--ink-primary); }
.stepper { display: flex; align-items: center; gap: var(--space-12); } .stepper-n { display: grid; place-items: center; min-width: 20px; }
.tick { position: absolute; right: -3px; top: -3px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); animation: pop var(--duration-base) var(--ease-spring); }
.tickbox { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-pill); border: 1px solid var(--ink-tertiary); } .tickbox svg { opacity: 0; }
.tickbox.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .tickbox.on svg { opacity: 1; }
.radio { position: relative; flex: none; width: 22px; height: 22px; border-radius: var(--radius-pill); border: 1px solid var(--ink-tertiary); }
.radio.on { border-color: var(--ink-primary); } .radio.on::after { content: ""; position: absolute; inset: 5px; border-radius: var(--radius-pill); background: var(--ink-primary); }
.field { height: var(--control-lg); min-width: 0; padding: 0 var(--space-20); border: 1px solid var(--line-hair); border-radius: var(--radius-pill); background: var(--surface-bg); color: var(--ink-primary); outline: none; font-size: 16px; user-select: text; -webkit-user-select: text; }
.field:focus { border-color: var(--ink-primary); } .field::placeholder { color: var(--ink-tertiary); opacity: 1; }
.tag { display: inline-flex; align-items: center; gap: var(--space-8); height: 28px; padding: 0 var(--space-12); border-radius: var(--radius-pill); background: var(--surface-inset); }
.sheet .tag, .recipe .tag { background: var(--surface-card); }
.note { padding: var(--space-16); border-radius: var(--radius-tile); background: var(--surface-card); }
.thumb { position: relative; flex: none; display: inline-grid; place-items: center; border-radius: var(--radius-tile); background: var(--surface-card); color: var(--ink-secondary); }
.avatar { flex: none; display: inline-grid; place-items: center; border-radius: var(--radius-pill); color: var(--ink-inverse); } .avatar.on { outline: 2px solid var(--ink-primary); outline-offset: 3px; }
.bar { position: relative; height: 6px; border-radius: var(--radius-pill); background: var(--surface-card); overflow: hidden; }
.bar i { position: absolute; inset: 0; border-radius: inherit; transform-origin: left center; transition: transform var(--duration-slow) var(--ease-out); }
.bar-fill { background: var(--accent); } .bar-est { background: color-mix(in srgb, var(--accent) 38%, var(--surface-card)); }
.toast { position: absolute; z-index: 60; left: var(--gl); right: var(--gr); bottom: calc(92px + var(--sb)); display: flex; align-items: center; gap: var(--space-12); min-height: 48px; padding: var(--space-8) var(--space-20); border-radius: var(--radius-pill); background: var(--ink-primary); color: var(--ink-inverse); }
.toast-act { flex: none; text-decoration: underline; text-underline-offset: 3px; }

/* Sheets */
.ov { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; animation: fade-in var(--duration-fast) var(--ease-out); }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; display: flex; flex-direction: column; max-height: calc(100% - var(--space-48) - var(--st)); background: var(--surface-bg); color: var(--ink-primary); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; animation: sheet-in var(--duration-slow) var(--ease-out); }
.sheet--full { height: calc(100% - var(--space-32) - var(--st)); }
.sheet .scroll { flex: 1 1 auto; min-height: 0; }
.sheet-grab { flex: none; display: grid; place-items: center; height: 28px; touch-action: none; cursor: grab; } .sheet-grab i { width: 36px; height: 4px; border-radius: var(--radius-pill); background: var(--line-hair); }
.sheet-pad { padding-bottom: calc(var(--space-20) + var(--sb)); }
@keyframes sheet-in { from { transform: translateY(100%); } }

/* Dial and arc picker */
.dial-win { position: relative; height: 96px; }
.dial-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.dial-needle { position: absolute; left: 50%; top: 2px; width: 3px; height: 38px; margin-left: -1.5px; border-radius: var(--radius-pill); background: var(--ink-primary); }
.dial-sc { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; cursor: ew-resize; } .dial-sc::-webkit-scrollbar { display: none; }
.dial-snap { flex: none; width: 12px; height: 100%; scroll-snap-align: center; } .dial-pad { flex: none; width: calc(50% - 6px); }
.arc { position: relative; height: 300px; overflow: hidden; }
.arc-line { position: absolute; left: var(--gl); top: 0; width: 60px; height: 100%; color: var(--ink-tertiary); }
.arc-mark { position: absolute; left: calc(var(--gl) + 27px); top: 50%; width: 7px; height: 30px; margin-top: -15px; border-radius: var(--radius-pill); background: var(--ink-primary); }
.arc-sc { position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; padding-left: calc(var(--gl) + 28px); } .arc-sc::-webkit-scrollbar { display: none; }
.arc-pad { display: block; height: 116px; }
.arc-item { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; height: 68px; padding-right: var(--gr); scroll-snap-align: center; transform-origin: left center; }

/* Finished moments: one glow, one number, one line, one button */
.celebrate { z-index: 30; overflow: hidden; }
.cel-top { position: absolute; top: 0; left: 50%; height: 60%; aspect-ratio: 1; transform: translateX(-50%); }
.cel-bloom, .cel-aura { position: absolute; transform-origin: 50% 120%; }
.cel-bloom { left: -12%; top: -16%; width: 124%; height: 124%; opacity: 0.55; filter: blur(60px); }
.cel-aura { left: 0; top: -6%; width: 100%; height: 100%; }

/* Arc picker: options ride a curve, the one at the mark is chosen. */
function ArcPicker({ options, value, onChange, label }) {
  const IH = 68, sc = useRef(null), raf = useRef(0);
  const cur = useRef(Math.max(0, options.findIndex(o => o.id === value)));
  const lay = () => {
    const s = sc.current; if (!s) return; const pos = s.scrollTop / IH;
    Array.from(s.querySelectorAll('.arc-item')).forEach((el, i) => {
      const d = i - pos, ad = Math.abs(d);
      el.style.transform = 'translateX(' + Math.max(0, 44 - d * d * 11).toFixed(1) + 'px) scale(' + (1 - Math.min(ad, 2.5) * .07).toFixed(3) + ')';
      el.style.opacity = (1 - Math.min(ad, 2.6) * .3).toFixed(2);
    });
  };
  useLayoutEffect(() => { sc.current.scrollTop = cur.current * IH; lay(); }, []);
  const onScroll = () => {
    cancelAnimationFrame(raf.current);
    raf.current = requestAnimationFrame(() => { lay(); const i = clamp(Math.round(sc.current.scrollTop / IH), 0, options.length - 1); if (i !== cur.current) { cur.current = i; buzz(2); onChange(options[i].id); } });
  };
  return html`<div class="arc">
    <svg class="arc-line" viewBox="0 0 60 300" preserveAspectRatio="none" aria-hidden="true"><path d="M0 -20Q64 150 0 320" fill="none" stroke="currentColor" strokeWidth="1" /></svg>
    <i class="arc-mark"></i>
    <div class="arc-sc" ref=${sc} onScroll=${onScroll} role="listbox" aria-label=${label}>
      <i class="arc-pad"></i>
      ${options.map((o, i) => html`<button type="button" key=${o.id} role="option" aria-selected=${o.id === value} class=${cx('arc-item', o.id === value && 'on')} onClick=${() => sc.current.scrollTo({ top: i * IH, behavior: 'smooth' })}>
        <span class="v2-headline">${o.n}</span>${o.sub && html`<span class="v2-caption ink2">${o.sub}</span>`}
      </button>`)}
      <i class="arc-pad"></i>
    </div>
  </div>`;
}

/* Celebration: one aura, one number, one line, one button. Rests after about two seconds. */
function Celebrate({ ov }) {
  const { micro, number, line, button, onDone, theme } = ov.props;
  const [n, setN] = useState(REDUCED ? number : 0);
  useEffect(() => {
    if (REDUCED) return; let raf = 0, t0 = null;
    const tick = t => { if (t0 === null) t0 = t; const p = clamp((t - t0 - 600) / 900, 0, 1); setN(Math.round(number * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, []);
  return html`<div class=${cx('full celebrate is-playing', ov.closing && 'out')} data-theme=${theme} role="dialog" aria-modal="true" aria-label=${number + ' ' + line}>
    <div class="cel-top"><span class="pk-aura cel-bloom" aria-hidden="true"></span><span class="pk-aura cel-aura" aria-hidden="true"></span></div>
    <div class="cel-body pad">

/* ───────────── Build from scratch: the dietitian's plate formula ───────────── */
const BUILD = {
  P: ['chicken', 'beef', 'salmon', 'whitefish', 'tuna', 'shrimp', 'egg', 'halloumi', 'chickpeas', 'lentils'],
  C: ['rice', 'pasta', 'quinoa', 'bulgur', 'potato', 'sweetpotato', 'bread', 'tortilla'],
  V: ['broccoli', 'carrot', 'zucchini', 'spinach', 'greenbeans', 'pepper', 'tomato', 'cucumber', 'lettuce', 'mushroom'],
  F: ['oliveoil', 'avocado', 'tahini', 'walnuts', 'almonds'],

const SHORT = { chicken: 'chicken', beef: 'beef', salmon: 'salmon', whitefish: 'white fish', tuna: 'tuna', egg: 'eggs', halloumi: 'halloumi', chickpeas: 'chickpeas', bread: 'bread', tortilla: 'tortilla', pepper: 'pepper', oliveoil: 'olive oil', sweetpotato: 'sweet potato', greenbeans: 'green beans' };

function runFill() {
  const list = fillPlan(store.s);
  list.forEach(([k, en], i) => setTimeout(() => { const cur = store.s.week; if (cur && !cur.slots[k]) putEntry(k, en); }, i * 110));
  setTimeout(() => toast(list.length ? 'Filled ' + list.length + (list.length === 1 ? ' gap' : ' gaps') + '. Tap a meal to see why it is there.' : 'The week is already full.'), list.length * 110 + 150);
}
/* ───────────── Profile ───────────── */
function ArcSheet({ ov }) {
  const p = ov.props, [v, setV] = useState(p.value);
  return html`<${Sheet} ov=${ov} label=${p.title}>
    <div class="pad col g4"><p class="v2-micro ink3">${p.micro}</p><h2 class="v2-title">${p.title}</h2></div>
    <${ArcPicker} options=${p.options} value=${v} label=${p.title} onChange=${x => { setV(x); p.onChange(x); }} />
    <div class="pad sheet-pad"><${Btn} block onClick=${() => close(ov.id)}>Done<//></div>
  <//>`;
}
const pickStartDay = () => { const s = store.s; open('arc', { micro: s.week ? 'Week ' + s.week.n : 'Household', title: 'The week starts on', options: DOW_LONG.map((n, i) => ({ id: String(i), n })), value: String(s.week ? s.week.startDow : s.house.startDow), onChange: v => mut(d => { if (d.week) d.week.startDow = +v; d.house.startDow = +v; }) }); };
function ListSheet({ ov }) {
  const s = useS(), kind = ov.props.kind, [text, setT] = useState('');
  const items = kind === 'never' ? s.hist.never : s.house.takeout;
  const add = e => { e.preventDefault(); const t = text.trim(); if (!t) return; mut(d => { d.house.takeout.push(t); }); setT(''); };
  return html`<${Sheet} ov=${ov} label=${kind === 'never' ? 'Never again' : 'Saved takeout list'}>
    <div class="pad col g8"><h2 class="v2-title">${kind === 'never' ? 'Never again' : 'Our saved takeout list'}</h2>
      <p class="v2-body ink2">${kind === 'never' ? 'Meals that will not be suggested. Any of them can come back.' : 'Healthier options agreed in advance. Ordering from here counts as a planned swap.'}</p></div>
    <div class="pad col sheet-pad scroll">
      ${items.map((x, i) => html`<div class="rowline" key=${x + i}><span class="v2-body grow">${kind === 'never' ? (getRecipe(x, s) || { n: x }).n : x}</span>
        <${Btn} kind="secondary" size="sm" onClick=${() => mut(d => { if (kind === 'never') d.hist.never = d.hist.never.filter(y => y !== x); else d.house.takeout.splice(i, 1); })}>${kind === 'never' ? 'Bring back' : 'Remove'}<//></div>`)}
      ${!items.length && html`<p class="v2-body ink2 rowline">${kind === 'never' ? 'Nothing here. Hold a card while swiping to add one.' : 'Nothing saved yet.'}</p>`}
      ${kind !== 'never' && html`<form class="row g8 mt16" onSubmit=${add}><input id="takeout-add" class="field v2-body grow" type="text" placeholder="Add an option" value=${text} onChange=${e => setT(e.target.value)} enterKeyHint="done" autoComplete="off" />
        <button type="submit" class="pk-iconbtn" aria-label="Add the option"><${Icon} n="plus" /></button></form>`}
    </div>
  <//>`;
}
function resetAll() { store.s = freshState(); save(); store.subs.forEach(f => f()); uiSet({ tab: 'home', stack: [], toast: null }); }
function ProfileTab() {
  const s = useS(), [who, setWho] = useState(s.me), p = s.profiles[who], sp = splitOf(p);
  const set = (k, v) => mut(d => { d.profiles[who][k] = v; });
  const wheel = (title, key, min, max, step, major, unit, more) => open('wheel', Object.assign({ title, micro: PEOPLE[who] + ' · ' + title, value: p[key], min, max, step, major, unit, onChange: v => set(key, v) }, more));
  return html`<div class="screen"><div class="scroll pad body-tabs col g24">
    <div class="topbar"><p class="v2-micro ink2">Profile</p><${IconBtn} n="sliders" label="Prototype controls" onClick=${() => open('demo')} /></div>
    <div class="row g20">${Object.keys(PEOPLE).map(x => html`<button type="button" key=${x} class=${cx('whopick', who === x && 'on')} aria-pressed=${who === x} onClick=${() => setWho(x)}><${Avatar} p=${x} s=${64} on=${who === x} /><span class="v2-label">${PEOPLE[x]}</span></button>`)}</div>
    <div class="col">
      <p class="v2-micro ink3 sec">${PEOPLE[who]} · numbers from the dietitian</p>
      <${Row} label="Weight" value=${p.weight + ' kg'} onClick=${() => wheel('Weight', 'weight', 40, 140, 1, 10, 'kg')} />
      <${Row} label="Height" value=${p.height + ' cm'} onClick=${() => wheel('Height', 'height', 140, 210, 1, 10, 'cm')} />
      <${Row} label="Activity" value=${ACTIVITY.find(a => a.id === p.activity).n} onClick=${() => open('arc', { micro: PEOPLE[who], title: 'How active are you?', options: ACTIVITY, value: p.activity, onChange: v => set('activity', v) })} />
      <${Row} label="Eating now" value=${nf(p.current) + ' kcal'} onClick=${() => wheel('Eating now', 'current', 1200, 3600, 50, 10, 'kcal a day')} />
      <${Row} label="Target" value=${nf(p.target) + ' kcal'} onClick=${() => wheel('Target', 'target', 1200, 3600, 50, 10, 'kcal a day')} />
      <${Row} label="Protein" value=${p.protein + ' g'} onClick=${() => wheel('Protein', 'protein', 60, 220, 5, 10, 'g a day')} />
      <div class="rowline col g12 stretch">
        <span class="v2-body">Split across the day</span>
        <${Seg} options=${SPLITS.map(x => [x.id, x.n])} value=${p.split} label="Meal split" onChange=${v => set('split', v)} />
        <span class="col g4"><span class="v2-number ink2 tnum">${SLOTS.map(m => MEAL[m][0] + ' ' + nf(p.target * sp[m])).join(' · ')} kcal</span>
          <span class="v2-number ink2 tnum">${SLOTS.map(m => MEAL[m][0] + ' ' + Math.round(p.protein * sp[m])).join(' · ')} g protein</span></span>
      </div>
      <${Row} label="Holding the phone" sub="Swipes, ratings and snacks save for this person" right=${html`<${Toggle} id="pf-me" on=${s.me === who} label="Holding the phone" onChange=${v => mut(d => { d.me = v ? who : other(who); })} />`} />
      <${Row} label="Sleep-aware days" sub="Opt in. After a short night, the day is planned to be more filling" right=${html`<${Toggle} id="pf-sleep" on=${p.sleepOn} label="Sleep-aware days" onChange=${v => set('sleepOn', v)} />`} />
      ${p.sleepOn && html`<${Row} label="A short night is under" value=${p.sleepUnder + ' h'} onClick=${() => wheel('A short night is under', 'sleepUnder', 3, 8, .5, 2, 'hours', { fmt: v => String(v), note: 'Only ' + PEOPLE[who] + ' sees this number.' })} />`}
      ${p.sleepOn && html`<${Row} label="Last night" sub="Stands in for the wearable in this prototype" value=${p.lastSleep ? fmtHours(p.lastSleep) : 'not logged'} onClick=${() => open('wheel', { title: 'Last night', micro: PEOPLE[who] + ' · sleep', value: p.lastSleep || 7, min: 2, max: 10, step: .5, major: 2, unit: 'hours', fmt: v => String(v), note: 'Under ' + p.sleepUnder + ' hours, today is offered as a more filling day.', onChange: v => logSleep(who, v) })} />`}
    </div>
    <div class="col">
      <p class="v2-micro ink3 sec">Household</p>
      <${Row} label="Rhea's meals" sub="Her portion comes out before salt, spices or sauce" right=${html`<${Toggle} id="pf-rhea" on=${s.house.rhea} label="Rhea's meals" onChange=${v => mut(d => { d.house.rhea = v; })} />`} />
      <${Row} label="UC considerations" sub="Shows what to leave out on a flare day" right=${html`<${Toggle} id="pf-uc" on=${s.house.uc} label="UC considerations" onChange=${v => mut(d => { d.house.uc = v; })} />`} />
      <${Row} label="Friday planning" value=${hhmm(s.house.friday)} onClick=${() => open('wheel', { title: 'Friday planning', micro: 'Fridays · after bedtime', value: s.house.friday, min: 17 * 60, max: 23 * 60 + 30, step: 15, major: 4, unit: '', fmt: hhmm, tick: v => String(Math.floor(v / 60)), onChange: v => mut(d => { d.house.friday = v; }) })} />
      <${Row} label="Week starts on" value=${DOW_LONG[s.week ? s.week.startDow : s.house.startDow]} onClick=${pickStartDay} />
      <div class="rowline col g12 stretch"><span class="col"><span class="v2-body">Usually packed days</span><span class="v2-caption ink2">Quick meals land on these days</span></span>
        <div class="days">${DOW.map((d, i) => { const on = s.house.crunch.includes(i); return html`<button type="button" key=${d} class=${cx('day v2-micro', on && 'on')} aria-pressed=${on} aria-label=${DOW_LONG[i]} onClick=${() => mut(x => { x.house.crunch = on ? x.house.crunch.filter(y => y !== i) : x.house.crunch.concat([i]); })}>${d[0]}</button>`; })}</div></div>
      <${Row} label="Saved takeout list" value=${s.house.takeout.length} onClick=${() => open('list', { kind: 'takeout' })} />
      <${Row} label="Never again" value=${s.hist.never.length} onClick=${() => open('list', { kind: 'never' })} />
    </div>
    <div class="col">
      <p class="v2-micro ink3 sec">Prototype</p>
      <${Row} label="Prototype controls" sub="Move through the week, simulate a rough night" onClick=${() => open('demo')} />
      <${Row} label="Start over" sub="Clears everything saved on this phone" onClick=${() => open('confirm', { title: 'Start over?', body: 'Profiles, the week, ratings and the grocery list are cleared from this phone.', yes: 'Clear everything', onYes: resetAll })} />
    </div>
  </div></div>`;
}
function DemoSheet({ ov }) {
  const s = useS(), w = s.week, active = w && w.status === 'active', me = s.me;
  const go = fn => { close(ov.id); fn(); };
  return html`<${Sheet} ov=${ov} label="Prototype controls">
    <div class="pad col g8"><p class="v2-micro ink3">Prototype controls</p><h2 class="v2-title">Move through the week</h2>
      <p class="v2-body ink2">Days move by hand in this prototype. Everything else is real and saved on this phone.</p></div>
    <div class="pad col sheet-pad mt8">
      ${active && w.day < 6 && html`<${OptRow} title=${'Go to ' + dayName(w, w.day + 1, 1)} sub="Moves today forward by one day" onClick=${() => go(() => { mut(d => { d.week.day++; }); uiSet({ tab: 'home' }); })} />`}
      ${active && html`<${OptRow} title="Simulate a rough night" sub=${'Reads as 4 h 40 min of sleep for ' + PEOPLE[me] + '. Turns on sleep-aware days'} onClick=${() => go(() => { mut(d => { d.profiles[me].sleepOn = true; }); flagRough(me, 4.67); uiSet({ tab: 'home' }); open('rough'); })} />`}
      ${active && html`<${OptRow} title="Mark the whole week as eaten" sub="For a quick look at a good weekly close" onClick=${() => go(() => { mut(d => { Object.values(d.week.slots).forEach(en => { if (en) en.done = true; }); d.week.day = 6; d.week.stocked = true; }); uiSet({ tab: 'home' }); })} />`}
      ${active && html`<${OptRow} title="Close the week now" sub="Shows the weekly close with the numbers as they are" onClick=${() => go(openClose)} />`}
      ${!active && html`<${OptRow} title="Start the Friday plan" sub="Opens the five-minute flow" onClick=${() => go(() => { if (!s.planning) startPlanning(); open('plan'); })} />`}
      <${OptRow} title="Start over" sub="Clears everything saved on this phone" onClick=${() => go(() => open('confirm', { title: 'Start over?', body: 'Profiles, the week, ratings and the grocery list are cleared from this phone.', yes: 'Clear everything', onYes: resetAll }))} />
    </div>
  <//>`;
}

/* ───────────── App shell ───────────── */
const OVERLAYS = { plan: PlanFlow, recipe: RecipeSheet, choice: ChoiceSheet, slot: SlotSheet, rhea: RheaSheet, cook: CookMode, rate: RateSheet, build: BuildSheet,
  celebrate: Celebrate, confirm: ConfirmSheet, wheel: WheelSheet, arc: ArcSheet, missing: MissingSheet, shoptime: ShopSheet, list: ListSheet,
  snap: SnapFlow, rescue: RescueSheet, rough: RoughSheet, demo: DemoSheet };
const TABVIEW = { home: Home, plan: PlanTab, groceries: GroceriesTab, profile: ProfileTab };
function App() {
  const s = useS(), u = useUI();
  useEffect(() => { const esc = e => { if (e.key === 'Escape') close(); }; window.addEventListener('keydown', esc); return () => window.removeEventListener('keydown', esc); }, []);
  if (!s.onboarded) return html`<${React.Fragment}><${Onboarding} /><${Toast} /><//>`;
  const Tab = TABVIEW[u.tab] || Home;
  return html`<${React.Fragment}>
    <div class="tabview pk-enter" key=${u.tab}><${Tab} /></div>
    <i class="dockbg"></i>
    <${TabBar} />
    ${u.stack.map(o => { const C = OVERLAYS[o.type]; return C ? html`<${C} key=${o.id} ov=${o} />` : null; })}
    <${Toast} />
  <//>`;
}
function fit() {
  const framed = window.matchMedia('(min-width:520px) and (min-height:560px)').matches;
  FIT = framed ? Math.min(1, (window.innerHeight - 32) / 844, (window.innerWidth - 32) / 390) : 1;
  document.documentElement.style.setProperty('--fit', String(FIT));
}
window.addEventListener('resize', fit); fit();
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);

})();
</script>
